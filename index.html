    <script>
      (function() {
        // Prevent benign Vite HMR websocket reconnection notices from bubbling up as uncaught errors
        function isViteNotice(arg) {
          if (!arg) return false;
          var str = '';
          try {
            str = typeof arg === 'string' ? arg : (arg.message || arg.stack || JSON.stringify(arg) || String(arg));
          } catch (_) {
            str = String(arg);
          }
          return str.indexOf('[vite]') !== -1 || str.indexOf('vite-hmr') !== -1 || str.indexOf('WebSocket') !== -1 || str.indexOf('failed to connect to websocket') !== -1;
        }

        var origError = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isViteNotice(arguments[i])) return;
          }
          origError.apply(console, arguments);
        };

        var origWarn = console.warn;
        console.warn = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isViteNotice(arguments[i])) return;
          }
          origWarn.apply(console, arguments);
        };

        window.addEventListener('error', function(event) {
          if (isViteNotice(event.message) || isViteNotice(event.error)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (isViteNotice(event.reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
