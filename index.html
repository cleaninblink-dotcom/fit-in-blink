    <script>
      (function() {
        // Suppress benign Vite HMR messages and websocket notices in container environment
        var origError = console.error;
        console.error = function() {
          var firstArg = arguments[0];
          if (typeof firstArg === 'string' && (firstArg.indexOf('[vite]') !== -1 || firstArg.indexOf('WebSocket') !== -1)) {
            return;
          }
          origError.apply(console, arguments);
        };
        var origWarn = console.warn;
        console.warn = function() {
          var firstArg = arguments[0];
          if (typeof firstArg === 'string' && firstArg.indexOf('[vite]') !== -1) {
            return;
          }
          origWarn.apply(console, arguments);
        };
      })();
    </script>
